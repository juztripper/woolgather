name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          echo "PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run check:format

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check deployment bundle
        run: npm run deploy:check
