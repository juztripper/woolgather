name: Feature proposal
description: Propose a focused improvement grounded in a user problem
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, for whom, and in what situation?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the improvement without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can people do today, and why is it insufficient?

  - type: textarea
    id: boundaries
    attributes:
      label: Important boundaries
      description: Note privacy, recovery, accessibility, cost, or compatibility concerns.

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: This proposal contains no private user or project data.
          required: true
