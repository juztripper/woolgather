<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your woolgather account</title></head>
  <body style="margin:0;padding:32px 16px;background:#edf1f2;color:#304a5b;font-family:'Avenir Next',Arial,sans-serif">
    <table role="presentation" style="width:100%;max-width:520px;margin:0 auto;border-collapse:collapse"><tr><td style="padding:32px;background:#fafbf9;border:1px solid #dce3e4;border-radius:16px">
      <p style="margin:0 0 28px;font-size:24px;font-weight:600;letter-spacing:-1px">woolgather</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;font-weight:500">Confirm your email</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6">Confirm this email address to finish creating your woolgather account. Open the link in the browser where you signed up.</p>
      <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:9px;background:#2d404e;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600">Confirm email</a></p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#667982">If you didn’t create an account, you can ignore this email.</p>
    </td></tr></table>
  </body>
</html>
